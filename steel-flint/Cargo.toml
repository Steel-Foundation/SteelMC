[package]
name = "steel-flint"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["Jonas Bauer"]
description = "Flint testing framework integration for SteelMC"

[dependencies]
# Internal crates
steel-core = { workspace = true, features = ["test-framework"] }
steel-protocol.workspace = true
steel-registry.workspace = true
steel-utils.workspace = true

glam.workspace = true
simdnbt.workspace = true

# Text components for disconnect messages
text_components.workspace = true

# Flint testing framework
flint-core = { git = "https://github.com/FlintTestMC/flint-core.git", rev = "v1.2.2" }

# Async
tokio.workspace = true

# Logging
tracing.workspace = true

# Thread pool for world generation
rayon.workspace = true

# Hash maps
rustc-hash.workspace = true

# Serialization (for flint-core compatibility)
dotenvy = "0.15.7"
toml.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1.29.0", features = ["v4"] }


[lints.rust]
missing_docs = "warn"

[lints.clippy]
single_call_fn = "allow"
multiple_inherent_impl = "allow"
shadow_unrelated = "allow"
missing_errors_doc = "allow"
struct_excessive_bools = "allow"
needless_pass_by_value = "allow"
cargo_common_metadata = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
absolute_paths = "warn"
missing_const_for_fn = "warn"
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
unwrap_used = { level = "warn", priority = -3 }

[[example]]
name = "steel-implemented"
path = "flint-utils/get_implemented.rs"
