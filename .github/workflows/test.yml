name: Test

on:
  push:
  pull_request:

env:
  # Limit concurrent compiler processes to reduce peak memory use.
  CARGO_BUILD_JOBS: "1"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --verbose
