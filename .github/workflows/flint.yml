name: Flint Tests

on:
  push:
    branches: [main, dev, ignite_portal]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SteelMC
        uses: actions/checkout@v4
        with:
          path: SteelMC

      - name: Checkout flint-steel
        uses: actions/checkout@v4
        with:
          repository: FlintTestMC/flint-steel
          ref: main
          path: flint-steel

      - name: Clone JunkysGenerator
        uses: actions/checkout@v4
        with:
          repository: FlintTestMC/JunkysGenerator
          path: JunkysGenerator

      - name: Clone FlintBenchmark
        uses: actions/checkout@v4
        with:
          repository: JunkyDeveloper/FlintBenchmark
          ref: walls
          path: FlintBenchmark

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            flint-steel -> target
            JunkysGenerator -> target

      - name: Build test generators
        working-directory: JunkysGenerator
        run: cargo build --release -p create-portal -p destroy-portal

      - name: Generate create-portal tests
        working-directory: JunkysGenerator/create-portal
        run: cargo run --release -p create-portal

      - name: Generate destroy-portal tests
        working-directory: JunkysGenerator/destroy-portal
        run: cargo run --release -p destroy-portal

      - name: Check generated tests for create-portal
        working-directory: JunkysGenerator/create-portal
        run: find ./test -type f -printf '.' | wc -c

      - name: Check generated tests for destroy-portal
        working-directory: JunkysGenerator/destroy-portal
        run: find ./test -type f -printf '.' | wc -c

      - name: Clean up generator build artifacts
        run: rm -rf JunkysGenerator/target

      - name: Configure SteelMC patch
        working-directory: flint-steel
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [patch."https://github.com/Steel-Foundation/SteelMC.git"]
          steel-core     = { path = "../SteelMC/steel-core" }
          steel-protocol = { path = "../SteelMC/steel-protocol" }
          steel-registry = { path = "../SteelMC/steel-registry" }
          steel-utils    = { path = "../SteelMC/steel-utils" }
          EOF
      - name: Run flint-steel tests
        working-directory: flint-steel
        continue-on-error: true
        timeout-minutes: 15
        env:
          TEST_PATH: ${{ github.workspace }}/JunkysGenerator
        run: cargo test --profile cicd --lib test_run_all_flint_benchmarks -- --nocapture

      - name: Run flint-steel tests
        working-directory: flint-steel
        timeout-minutes: 15
        env:
          TEST_PATH: ${{ github.workspace }}/FlintBenchmark/tests
        run: cargo test --profile cicd --lib test_run_all_flint_benchmarks -- --nocapture

      - name: Upload Flint summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flint-summary
          path: flint-steel/log/flint_summary.json
