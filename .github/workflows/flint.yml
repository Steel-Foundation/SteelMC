name: Flint Tests

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap_baseline:
        description: Publish the first baseline for this FlintBenchmark revision (master only)
        type: boolean
        default: false


env:
  CARGO_TERM_COLOR: always
  FLINT_DIR: steel-flint

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SteelMC
        uses: actions/checkout@v4

      - name: Clone FlintBenchmark
        id: benchmark
        uses: actions/checkout@v4
        with:
          repository: FlintTestMC/FlintBenchmark
          ref: caa22dbbbfff3d1b9766939834a308c335f7a989
          path: FlintBenchmark

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "steel-flint"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' || github.event_name == 'pull_request' }}

      - name: Build steel-flint
        id: build
        continue-on-error: true
        timeout-minutes: 15
        run: |
          cargo test -p steel-flint --profile cicd --lib --no-run
          cargo build -p steel-flint --profile cicd --example steel-implemented

      - name: Run steel-flint tests
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        env:
          TEST_PATH: ${{ github.workspace }}/FlintBenchmark/tests
          FLINT_VIZ_URL: "https://flinttestmc.github.io/FlintViz"
          FLINT_IMPLEMENTED_ONLY: "true"
        run: cargo test -p steel-flint --profile cicd --lib test_run_flint_selected -- --ignored --nocapture

      - name: Dump implemented blocks and items
        id: implemented
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: cargo run -q -p steel-flint --profile cicd --example steel-implemented -- implemented.txt

      - name: Download baseline
        id: baseline
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: flint-baseline-${{ steps.benchmark.outputs.commit }}
          branch: master
          workflow: flint.yml
          # Use the newest master run that actually has the artifact, not just the newest green run.
          search_artifacts: true
          path: baseline

      - name: Download master implemented ids
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: flint-implemented
          branch: master
          workflow: flint.yml
          # Use the newest master run that actually has the artifact, not just the newest green run.
          search_artifacts: true
          path: baseline

      - name: Validate Flint results and baseline
        id: validate
        env:
          FLINT_BENCHMARK_SHA: ${{ steps.benchmark.outputs.commit }}
          FLINT_MASTER: ${{ github.ref == 'refs/heads/master' }}
          FLINT_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_baseline }}
        uses: actions/github-script@v7
        with:
          script: require('${{ github.workspace }}/.github/scripts/flint-report.js').validateInputs({ core })

      - name: Check for regressions
        id: regression
        if: steps.validate.outcome == 'success'
        # TODO delete later so it will fail if regression are there
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: require('${{ github.workspace }}/.github/scripts/flint-report.js').checkRegressions({ core })

      - name: Warn on non-blocking regression failure
        if: steps.regression.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: await require('${{ github.workspace }}/.github/scripts/flint-report.js').warnRegressions({ core })

      - name: Build PR report
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: require('${{ github.workspace }}/.github/scripts/flint-report.js').prReport({ core, context })

      - name: Upload PR report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: flint-pr-report
          path: report/

      - name: Merge baseline
        env:
          FLINT_BENCHMARK_SHA: ${{ steps.benchmark.outputs.commit }}
        if: github.ref == 'refs/heads/master' && steps.regression.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: require('${{ github.workspace }}/.github/scripts/flint-report.js').mergeBaselineStep()

      - name: Upload baseline artifact
        if: github.ref == 'refs/heads/master' && steps.regression.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: flint-baseline-${{ steps.benchmark.outputs.commit }}
          path: flint_baseline.json
          if-no-files-found: error

      - name: Upload implemented ids
        if: github.ref == 'refs/heads/master' && steps.implemented.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: flint-implemented
          path: implemented.txt

      - name: Upload Flint summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flint-summary
          path: ${{ env.FLINT_DIR }}/log/flint_summary.json
          archive: 'false'

      - name: Dispatch to SteelDocs
        if: github.ref == 'refs/heads/master'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          repository: Steel-Foundation/SteelDocs
          event-type: steel-updated
