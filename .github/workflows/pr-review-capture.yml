name: PR review capture

# Unprivileged half of the approval workflows. pull_request and
# pull_request_review are events GitHub forces GITHUB_TOKEN to read-only for
# when the PR comes from a fork, no matter what `permissions:` declares — so
# this job does no writes at all. It just records which PR changed; the actual
# work happens in approval-label.yml and approval-status.yml, triggered via
# workflow_run, which always runs with normal (non-fork-restricted) token
# permissions.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions: {}

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Save PR number
        run: echo "${{ github.event.pull_request.number }}" > pr_number.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr_number
          path: pr_number.txt
