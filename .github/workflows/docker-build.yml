name: Docker build

on:
  push:
    branches:
      - master
      - feat/docker-pelican
  pull_request:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          bake-target: normal
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nightly,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
          annotations: |
            org.opencontainers.image.description=Steel is a lightweight Rust implementation of the Minecraft server. It focuses on clean code, performance, extensibility, and ease of use.

      - name: Create Pelican Docker metadata
        id: meta-pelican
        uses: docker/metadata-action@v6
        with:
          bake-target: pelican
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nightly-pelican,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ github.event.release.tag_name }}-pelican,enable=${{ github.event_name == 'release' }}
          annotations: |
            org.opencontainers.image.description=Steel is a lightweight Rust implementation of the Minecraft server. It focuses on clean code, performance, extensibility, and ease of use.

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-tags }}
            cwd://${{ steps.meta.outputs.bake-file-labels }}
            cwd://${{ steps.meta.outputs.bake-file-annotations }}
            cwd://${{ steps.meta-pelican.outputs.bake-file-tags }}
            cwd://${{ steps.meta-pelican.outputs.bake-file-labels }}
            cwd://${{ steps.meta-pelican.outputs.bake-file-annotations }}
          targets: normal,pelican
          push: ${{ github.event_name != 'pull_request' }}
