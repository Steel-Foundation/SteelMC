[package]
name = "class-flattener"
version = "0.1.0"
edition = "2024"
publish = false
description = "Flattens decompiled vanilla Java classes so inherited and super-call behavior is visible in one place."

# Standalone dev tool: kept out of the main workspace so its C parser
# dependency is not built by normal Steel builds or CI.
[workspace]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rustc-hash = "2.1.3"
tree-sitter = "0.27"
tree-sitter-java = "0.23.5"

# Mirrors the main workspace lint policy (standalone crates cannot inherit it).
[lints.clippy]
single_call_fn = "allow"
multiple_inherent_impl = "allow"
shadow_unrelated = "allow"
missing_errors_doc = "allow"
struct_excessive_bools = "allow"
needless_pass_by_value = "allow"
cargo_common_metadata = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
"struct_field_names" = "allow"
absolute_paths = "warn"
missing_const_for_fn = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
clone_on_ref_ptr = "warn"
cloned_instead_of_copied = "warn"
redundant_clone = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
rc_mutex = "warn"
mutex_atomic = "warn"
significant_drop_in_scrutinee = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
try_err = "warn"
iter_with_drain = "warn"
unused_peekable = "warn"
trait_duplication_in_bounds = "warn"
derive_partial_eq_without_eq = "warn"
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
unwrap_used = { level = "warn", priority = -3 }
