[files]
extend-exclude = ["**/build_assets/**", "*.json"]

[type.locale]
extend-glob = ["**/locale.rs"]
check-file = false

[default.extend-words]
flate = "flate"
strat = "strat"
axe = "axe"
# Vanilla stronghold piece-type registry IDs (see `stronghold.rs`). These are
# short vanilla abbreviations (`shs`, `shsd`, `shrc`, `shlt`, ...) that the
# typo checker would otherwise flag. Add new entries here when introducing
# additional three-letter vanilla IDs.
shs = "shs"

[default]
locale = "en-us"
