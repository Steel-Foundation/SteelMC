#:schema https://raw.githubusercontent.com/Steel-Foundation/SteelMC/refs/heads/master/package-content/groups.schema.json
# Documentation: https://steelmc.dev/configuration/permissions/

# The vanilla groups (all, moderators, gamemasters, admins, owners) are added at
# startup as empty groups. Each one derives an allow-only fallback from the vanilla
# command permissions, consulted only for permissions left unset here.

default_groups = ["all"]
op_group = "owners"
command_block_groups = ["gamemasters"]
