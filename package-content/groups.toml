#:schema https://raw.githubusercontent.com/4lve/SteelMC/refs/heads/master/package-content/groups.schema.json

# Permission groups assigned by the server.
default_groups = ["default"]

[groups.default]
priority = 0
inherits = []
allow = []
deny = []
# Namespaced typed values consumed by Steel subsystems and plugins.
# More-specific contexts win; equally specific entries use group priority.
# metadata = [
#     { key = "plugin:prefix", value = "[Builder]" },
#     { key = "plugin:max_homes{domain=survival}", value = 5 },
# ]
metadata = []

[groups.op]
priority = 0
inherits = []
allow = ["*"]
deny = []
metadata = []
